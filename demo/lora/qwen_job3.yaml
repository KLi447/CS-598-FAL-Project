dispatcher:
  name: "default"
  concurrency_num: 1  # Uses 1 GPU

datasets:
  - name: "data"
    data: "demo/data.json"
    prompt: "demo/prompt.yaml"
    prompt_type: "instruction"
    preprocess: "shuffle"

adapters:
  - name: "lora_1"
    type: "lora"
    path: "adapters/lora_sft_1"
    optimizer: "adamw"
    lr: 3e-4
    r: 32             # Rank 32
    alpha: 64    # alpha = 2x rank (common practice)
    dropout: 0.05
    target_modules:
      q_proj: true
      k_proj: true
      v_proj: true
      o_proj: true
      gate_proj: false
      down_proj: false
      up_proj: false

tasks:
  - type: "train"
    name: "task_1"
    adapter: "lora_1"
    dataset: "data"
    batch_size: 32   
    mini_batch_size: 32
    num_epochs: 50
    cutoff_len: 2048   
    save_step: 2000